name: 同步资产、更新日志与JS混淆
on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 1 * * *" # UTC+8凌晨1点
  workflow_dispatch:
    inputs:
      force_update:
        description: '是否强制更新（忽略版本检查）'
        required: false
        default: 'false'

permissions:
  contents: read # 最小权限，仅需读取仓库内容（如需提交需改为 write）

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 延长超时时间
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 浅克隆加速

      - name: 安装依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget jq unzip # translate-shell 如需翻译请取消注释
          npm install -g terser
          # sudo apt-get install -y translate-shell # 如需翻译日志请启用

      - name: 创建资产目录（英文路径）
        run: |
          mkdir -p unobfuscated
          mkdir -p obfuscated

      - name: 下载最新资产到未混淆目录
        id: download-assets
        env:
          REPO_OWNER: ${{ github.repository_owner }} # 自动获取仓库所有者
          REPO_NAME: ${{ github.repository_name }}     # 自动获取仓库名
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -s https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest)
          TAG_NAME=$(echo "$response" | jq -r '.tag_name')
          ASSETS=($(echo "$response" | jq -r '.assets[].name'))
          HAS_WORKER_JS=0 # 标记是否包含 worker.js

          for asset in "${ASSETS[@]}"; do # 修正循环语法（删除冒号）
            DOWNLOAD_URL=$(echo "$response" | jq -r ".assets[] | select(.name == \"$asset\") | .browser_download_url")
            wget -q --show-progress "$DOWNLOAD_URL" -O "unobfuscated/$asset"
            echo "已下载原始资产: unobfuscated/$asset"
            [[ "$asset" =~ worker\.js$ ]] && HAS_WORKER_JS=1 # 检测是否包含 worker.js
          done

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "ASSETS=$(printf "%s " "${ASSETS[@]}")" >> $GITHUB_OUTPUT # 安全拼接数组
          echo "HAS_WORKER_JS=$HAS_WORKER_JS" >> $GITHUB_OUTPUT # 输出标记

      - name: 同步更新日志
        id: update-log
        run: |
          set -euo pipefail
          FORCE_UPDATE=${{ github.event.inputs.force_update || 'false' }}
          LOCAL_VERSION=$(cat version.txt 2>/dev/null || "0.0.0") # 初始版本默认值
          TAG_NAME=${{ steps.download-assets.outputs.TAG_NAME }}
          RELEASE_NOTES=$(curl -s https://api.github.com/repos/${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}/releases/latest | jq -r '.body')
          ASSETS=${{ steps.download-assets.outputs.ASSETS }}

          if [ "$LOCAL_VERSION" = "$TAG_NAME" ] && [ "$FORCE_UPDATE" != "true" ]; then
            echo "✅ 已是最新版本（$TAG_NAME），无需更新日志"
            exit 0
          fi

          echo "$TAG_NAME" > version.txt
          echo -e "## 📦 资产更新日志\n### $TAG_NAME\n资产文件: $ASSETS\n\n$RELEASE_NOTES" >> README.md # 暂不翻译

      - name: 混淆指定JS文件（示例：worker.js）
        if: steps.download-assets.outputs.HAS_WORKER_JS == 1 # 使用标记判断
        run: |
          cd unobfuscated
          if [ -f "worker.js" ]; then
            echo "正在混淆 worker.js..."
            terser worker.js --compress --mangle -o ../obfuscated/worker.js
            echo "✅ 混淆完成，已保存到 obfuscated/worker.js"
          else
            echo "未找到未混淆的 worker.js 文件，跳过混淆步骤"
          fi
          cd ..

      - name: 提交所有文件（含空目录处理）
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 同步资产、更新日志并混淆JS文件"
          files: |
            unobfuscated/
            obfuscated/
            version.txt
            README.md
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          args: --allow-empty # 允许空提交（避免目录为空时出错）
