name: 混淆 Worker.zip 中的 JS 文件
on:
  workflow_dispatch: # 手动触发（也可配置为 push/schedule）
    inputs:
      force_update:
        description: '是否强制更新（忽略版本检查）'
        required: false
        default: 'false'

permissions:
  contents: write # 必需的写入权限

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 浅克隆加速

      - name: 安装混淆工具
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip # 解压工具
          npm install -g terser # JS 混淆工具

      - name: 下载最新版本资产（含授权）
        id: download-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 确保令牌已在仓库 Secrets 中配置
        run: |
          set -euo pipefail
          REPO_OWNER="bia-pain-bache"
          REPO_NAME="BPB-Worker-Panel"
          
          # 带授权头访问 GitHub API
          response=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest)
          
          # 检查响应是否为空
          if [[ -z "$response" ]]; then
            echo "❌ 无法获取版本信息，可能是授权失败或仓库不存在"
            exit 1
          fi

          TAG_NAME=$(echo "$response" | jq -r '.tag_name')
          ASSETS=($(echo "$response" | jq -r '.assets[].name'))
          
          # 检查是否存在 Worker.zip
          if ! echo "${ASSETS[@]}" | grep -q "Worker\.zip"; then
            echo "❌ 最新版本中未找到 Worker.zip"
            exit 1
          fi

          # 下载 Worker.zip 到未混淆目录
          DOWNLOAD_URL=$(echo "$response" | jq -r '.assets[] | select(.name == "Worker.zip") | .browser_download_url')
          mkdir -p unobfuscated
          curl -sL -H "Authorization: token $GITHUB_TOKEN" "$DOWNLOAD_URL" -o unobfuscated/Worker.zip
          echo "✅ 已下载 Worker.zip: $TAG_NAME"

      - name: 混淆 Worker.zip 中的 JS 文件
        run: |
          set -euo pipefail
          WORKER_ZIP="unobfuscated/Worker.zip"
          TEMP_DIR=$(mktemp -d)
          
          # 解压文件
          unzip -q "$WORKER_ZIP" -d "$TEMP_DIR"
          echo "已解压到临时目录: $TEMP_DIR"

          # 查找并混淆所有 JS 文件
          find "$TEMP_DIR" -type f -name "*.js" | while read -r js_file; do
            FILENAME=$(basename "$js_file")
            OBFUSCATED_FILE="obfuscated/${FILENAME%.*}_obfuscated.js"
            
            # 执行混淆（添加详细错误信息）
            terser "$js_file" --compress --mangle -o "$OBFUSCATED_FILE" || {
              echo "❌ 混淆失败: $FILENAME"
              exit 1
            }
            echo "✅ 混淆完成: $FILENAME -> ${OBFUSCATED_FILE##*/}"
          done

          # 清理临时目录
          rm -rf "$TEMP_DIR"

      - name: 提交混淆结果到仓库
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 混淆 Worker.zip 中的 JS 文件 (版本: ${{ steps.download-latest.outputs.TAG_NAME }})"
          files: |
            unobfuscated/Worker.zip
            obfuscated/
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          args: --allow-empty-directory # 允许空目录提交
