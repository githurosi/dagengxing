name: 混淆 Worker.zip 中的 JS 文件
on:
  workflow_dispatch: # 手动触发（也可配置为 push/schedule）
    inputs:
      force_update:
        description: '是否强制更新（忽略版本检查）'
        required: false
        default: 'false'

permissions:
  contents: write # 需写入权限以提交混淆结果

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 浅克隆加速

      - name: 安装混淆工具
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip # 解压工具
          npm install -g terser # JS 混淆工具

      - name: 下载最新版本资产
        id: download-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_OWNER="bia-pain-bache"
          REPO_NAME="BPB-Worker-Panel"
          # 获取最新版本信息
          response=$(curl -s https://api.github.com
