name: 同步资产、更新日志与JS混淆
on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 1 * * *" # UTC+8凌晨1点
  workflow_dispatch:
    inputs:
      force_update:
        description: '是否强制更新（忽略版本检查）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 浅克隆加速

      - name: 安装依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget jq unzip
          npm install -g terser # 提前安装Terser，确保混淆步骤依赖完整

      - name: 创建资产目录
        run: |
          mkdir -p 未混淆          # 原始资产目录
          mkdir -p 已混淆          # 混淆后资产目录

      - name: 下载最新资产到未混淆目录
        id: download-assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_OWNER="bia-pain-bache"
          REPO_NAME="BPB-Worker-Panel"
          response=$(curl -s https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest)
          TAG_NAME=$(echo "$response" | jq -r '.tag_name')
          ASSETS=($(echo "$response" | jq -r '.assets[].name'))

          for asset in "${ASSETS[@]}"; do
            DOWNLOAD_URL=$(echo "$response" | jq -r ".assets[] | select(.name == \"$asset\") | .browser_download_url")
            wget -q --show-progress "$DOWNLOAD_URL" -O "未混淆/$asset"
            echo "已下载原始资产: 未混淆/$asset"
          done

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "ASSETS=$(echo ${ASSETS[*]})" >> $GITHUB_OUTPUT

      - name: 同步更新日志
        id: update-log
        run: |
          set -euo pipefail
          FORCE_UPDATE=${{ github.event.inputs.force_update || 'false' }}
          LOCAL_VERSION=$(cat version.txt 2>/dev/null || echo "")
          TAG_NAME=${{ steps.download-assets.outputs.TAG_NAME }}
          RELEASE_NOTES=$(curl -s https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest | jq -r '.body')

          if [ "$LOCAL_VERSION" = "$TAG_NAME" ] && [ "$FORCE_UPDATE" != "true" ]; then
            echo "✅ 已是最新版本（$TAG_NAME），无需更新日志"
            exit 0
          fi

          # 翻译日志（可选，需安装translate-shell）
          # TRANSLATED_NOTES=$(echo "$RELEASE_NOTES" | trans -b -e google -t zh-CN || echo "$RELEASE_NOTES")
          TRANSLATED_NOTES="$RELEASE_NOTES" # 暂不翻译，保留原文

          echo "$TAG_NAME" > version.txt
          echo -e "## 📦 资产更新日志\n### $TAG_NAME\n资产文件: ${ASSETS[*]}\n\n$TRANSLATED_NOTES" >> README.md

      - name: 混淆指定JS文件（示例：worker.js）
        if: steps.download-assets.outputs.ASSETS =~ 'worker\.js$'
        run: |
          # 确保工作目录切换到包含未混淆文件的目录
          cd 未混淆
          if [ -f "worker.js" ]; then
            echo "正在混淆 worker.js..."
            terser worker.js --compress --mangle -o ../已混淆/worker.js
            echo "✅ 混淆完成，已保存到已混淆/worker.js"
          else
            echo "未找到未混淆的worker.js文件，跳过混淆步骤"
          fi
          cd .. # 切换回上级目录

      - name: 提交所有文件
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 同步资产、更新日志并混淆JS文件"
          files: |
            未混淆/
            已混淆/
            version.txt
            README.md
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
