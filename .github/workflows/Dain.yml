name: 工作流混淆 JS 文件（使用 uglify - js）
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  obfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 安装混淆工具（uglify - js）
        run: |
          npm install -g uglify-js
      - name: 下载并解压 worker.zip（使用令牌权限）
        run: |
          REPO_OWNER="bia-pain-bache" 
          REPO_NAME="BPB-Worker-Panel" 
          # 使用令牌获取下载链接
          response=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest)
          if [[ -z "$response" ]]; then
            echo "❌ 无法获取仓库响应，检查仓库名或 GITHUB_TOKEN 权限"
            exit 1
          fi
          DOWNLOAD_URL=$(echo "$response" | jq -r '.assets[] | select(.name == "worker.zip") | .browser_download_url')
          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo "❌ 未找到 worker.zip 资产"
            exit 1
          fi
          # 使用令牌下载文件
          mkdir -p unobfuscated
          curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$DOWNLOAD_URL" -o unobfuscated/worker.zip
          if [[ ! -f unobfuscated/worker.zip ]]; then
            echo "❌ 下载的 worker.zip 文件不存在，检查网络或链接"
            exit 1
          fi
          # 解压文件
          unzip -q unobfuscated/worker.zip -d unobfuscated/
          if [[ $? -ne 0 ]]; then
            echo "❌ 解压 worker.zip 失败，检查压缩包完整性"
            exit 1
          fi
          echo "✅ 下载并解压 worker.zip 成功"
      - name: 混淆 JS 文件到根目录“混淆”文件夹（用 uglify - js）
        run: |
          mkdir -p 混淆
          find unobfuscated -type f -name "*.js" | while read -r js_file; do
            FILENAME=$(basename "$js_file")
            OUTPUT_FILE="混淆/${FILENAME%.*}_obfuscated.js"
            uglifyjs "$js_file" -o "$OUTPUT_FILE" -c -m
            if [! -f "$OUTPUT_FILE" ]; then
              echo "❌ 混淆文件 $OUTPUT_FILE 未生成，检查工具输出"
              exit 1
            else
              echo "✅ 成功混淆: $FILENAME -> $OUTPUT_FILE"
            fi
          done
      - name: 提交结果
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 工作流混淆 JS 文件"
          files: |
            unobfuscated/
            混淆/
          args: --allow-empty-directory
