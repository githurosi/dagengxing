name: 资产同步到根目录（含 JS 文件）
on:
  push:
    branches: [main] 
  schedule:
    - cron: "0 16 * * *" # UTC 时间，如需调整为北京时间需根据时差换算
  workflow_dispatch: 
    inputs:
      force_update:
        description: '是否强制更新（忽略版本检查）'
        required: false
        default: 'false'

permissions:
  contents: write 

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 

      - name: 安装工具
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip 

      - name: 下载最新版本资产
        id: download-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_OWNER="bia-pain-bache" # 请确认实际仓库所有者名称
          REPO_NAME="BPB-Worker-Panel" # 请确认实际仓库名称
          
          response=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest)
          
          if [[ -z "$response" ]]; then
            echo "❌ 无法获取版本信息，可能是授权失败或仓库不存在"
            exit 1
          fi

          TAG_NAME=$(echo "$response" | jq -r '.tag_name')
          DOWNLOAD_URL=$(echo "$response" | jq -r '.assets[] | select(.name == "worker.zip") | .browser_download_url')
          
          curl -sL -H "Authorization: token $GITHUB_TOKEN" "$DOWNLOAD_URL" -o worker.zip
          echo "✅ 已下载 worker.zip: $TAG_NAME"

      - name: 解压 worker.zip 到根目录
        run: |
          unzip -q worker.zip
          echo "已解压 worker.zip 到当前目录，包含 JS 文件"

      - name: 提交资产到仓库
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📦 同步 worker.zip 及 JS 文件到仓库 (版本: ${{ steps.download-latest.outputs.TAG_NAME }})"
          files: |
            worker.zip
            *.js # 提交所有 JS 文件
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          args: --allow-empty-directory
