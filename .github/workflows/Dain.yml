name: 工作流自带混淆（保留未混淆代码）
on:
  push:
    branches: [main] 
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 

      - name: 安装混淆工具
        run: |
          npm install -g javascript-obfuscator@latest

      - name: 下载并解压 worker.zip
        run: |
          REPO_OWNER="bia-pain-bache" 
          REPO_NAME="BPB-Worker-Panel" 
          response=$(curl -s https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest)
          DOWNLOAD_URL=$(echo "$response" | jq -r '.assets[] | select(.name == "worker.zip") | .browser_download_url')
          mkdir -p unobfuscated
          curl -sL "$DOWNLOAD_URL" -o unobfuscated/worker.zip
          unzip -q unobfuscated/worker.zip -d unobfuscated/
          echo "✅ 下载并解压完成"

      - name: 混淆 JS 文件到根目录“混淆”文件夹
        run: |
          mkdir -p 混淆
          find unobfuscated -type f -name "*.js" | while read -r js_file; do
            FILENAME=$(basename "$js_file")
            OUTPUT_FILE="混淆/${FILENAME%.*}_obfuscated.js"
            # 基础混淆参数，可根据需要添加更多参数（如 --control-flow-flattening）
            javascript-obfuscator "$js_file" "$OUTPUT_FILE" --compact --variable-name-changer hexadecimal
            echo "✅ 混淆: $FILENAME -> ${FILENAME%.*}_obfuscated.js"
          done

      - name: 提交结果
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 工作流混淆 JS 文件"
          files: |
            unobfuscated/
            混淆/
          args: --allow-empty-directory
