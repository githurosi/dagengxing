name: worker 资产混淆工作流（基于 subworker 原理）
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  obfuscate-worker:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装混淆工具
        run: |
          npm install -g javascript-obfuscator@latest

      - name: 下载并解压 worker 资产
        run: |
          REPO_OWNER="Chilly-Blaze"  # subworker 仓库所有者
          REPO_NAME="subworker"       # 仓库名称
          response=$(curl -s https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest)
          DOWNLOAD_URL=$(echo "$response" | jq -r '.assets[] | select(.name == "worker.zip") | .browser_download_url')
          mkdir -p src unobfuscated
          curl -sL "$DOWNLOAD_URL" -o unobfuscated/worker.zip
          unzip -q unobfuscated/worker.zip -d unobfuscated/
          echo "✅ 解压完成，文件在 unobfuscated 目录"

      - name: 定向混淆核心 JS 文件（保留关键变量）
        run: |
          OBFUSCATED_DIR="混淆"
          mkdir -p "$OBFUSCATED_DIR"
          
          # 核心混淆参数（根据 subworker 原理保留特定变量）
          # --keep-fnames "assemblySubRequest" 保留请求格式变量
          # --control-flow-flattening 启用控制流平坦化
          # --dead-code-injection 注入死代码
          find unobfuscated/src -type f -name "*.js" | while read -r js_file; do
            FILENAME=$(basename "$js_file")
            OUTPUT_FILE="$OBFUSCATED_DIR/${FILENAME%.*}_obfuscated.js"
            
            javascript-obfuscator "$js_file" "$OUTPUT_FILE" \
              --compact \
              --variable-name-changer hexadecimal \
              --control-flow-flattening \
              --dead-code-injection \
              --dead-code-injection-threshold 0.4 \
              --keep-fnames "assemblySubRequest"  # 保留 subworker 核心变量
              
            echo "✅ 混淆: $FILENAME -> ${OUTPUT_FILE}"
          done

      - name: 提交混淆结果
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 混淆 worker 核心代码（基于 subworker 方案）"
          files: |
            混淆/
          args: --allow-empty-directory
