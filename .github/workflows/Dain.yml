name: BPB-Worker-Panel 资产混淆工作流
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  asset-obfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 安装工具
        run: |
          sudo apt-get update - y
          sudo apt-get install - y unzip
          npm install - g javascript - obfuscator@latest
      - name: 从 BPB-Worker-Panel 仓库下载 worker.zip
        run: |
          REPO_OWNER="bia-pain-bache"
          REPO_NAME="BPB-Worker-Panel"
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          response=$(curl -s https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest)
          DOWNLOAD_URL=$(echo "$response" | jq -r '.assets[] | select(.name == "worker.zip") | .browser_download_url')
          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo "❌ 未找到 worker.zip 资产，检查仓库是否有发布"
            exit 1
          fi
          mkdir -p "unobfuscated/versions/${TIMESTAMP}"
          curl -sL "$DOWNLOAD_URL" -o "unobfuscated/versions/${TIMESTAMP}/worker.zip"
          unzip -q "unobfuscated/versions/${TIMESTAMP}/worker.zip" -d "unobfuscated/versions/${TIMESTAMP}/"
          echo "✅ 下载解压完成：unobfuscated/versions/${TIMESTAMP}"
      - name: 混淆最新版本资产（处理 JS 文件）
        run: |
          LAST_VERSION=$(ls -d unobfuscated/versions/* | sort -r | head -n 1)
          OBFUSCATED_DIR="混淆"
          mkdir -p "$OBFUSCATED_DIR"
          find "$LAST_VERSION" -type f -name "*.js" | while read -r js_file; do
            FILENAME=$(basename "$js_file")
            OUTPUT_FILE="$OBFUSCATED_DIR/${FILENAME%.*}_obfuscated.js"
            # 明确指定 --dead-code-injection 的值为 true
            javascript-obfuscator "$js_file" "$OUTPUT_FILE" \
              --compact --variable-name-changer hexadecimal --dead-code-injection true
            echo "✅ 混淆完成：$FILENAME -> ${OUTPUT_FILE}"
          done
      - name: 提交结果（保留原始资产 + 混淆文件）
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📦 同步 BPB-Worker-Panel 资产 & 🔄 混淆代码"
          files: |
            unobfuscated/
            混淆/
          args: --allow-empty-directory --no-verify
