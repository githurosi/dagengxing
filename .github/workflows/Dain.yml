name: 混淆 worker.zip 中的 JS 文件
on:
  push:
    branches: [main] 
  schedule:
    - cron: "0 16 * * *" # UTC 时间，如需调整为北京时间需根据时差换算
  workflow_dispatch: 
    inputs:
      force_update:
        description: '是否强制更新（忽略版本检查）'
        required: false
        default: 'false'

permissions:
  contents: write 

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 

      - name: 安装工具
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip 
          npm install -g javascript - obfuscator@latest
          
      - name: 下载最新版本资产（含授权）
        id: download - latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set - euo pipefail
          REPO_OWNER="bia - pain - bache" # 请确认实际仓库所有者名称是否正确
          REPO_NAME="BPB - Worker - Panel" # 请确认实际仓库名称是否正确
          
          response=$(curl - s - H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest)
          
          if [[ - z "$response" ]]; then
            echo "❌ 无法获取版本信息，可能是授权失败或仓库不存在"
            exit 1
          fi

          TAG_NAME=$(echo "$response" | jq - r '.tag_name')
          ASSETS=($(echo "$response" | jq - r '.assets[].name'))
          
          if ! echo "${ASSETS[@]}" | grep - q "worker\.zip"; then
            echo "❌ 最新版本中未找到 worker.zip"
            exit 1
          fi

          DOWNLOAD_URL=$(echo "$response" | jq - r '.assets[] | select(.name == "worker.zip") | .browser_download_url')
          mkdir - p unobfuscated
          curl - sL - H "Authorization: token $GITHUB_TOKEN" "$DOWNLOAD_URL" - o unobfuscated/worker.zip
          echo "✅ 已下载 worker.zip: $TAG_NAME"

      - name: 解压 worker.zip
        id: extract - worker
        run: |
          set - euo pipefail
          WORKER_ZIP="unobfuscated/worker.zip"
          TEMP_DIR=$(mktemp - d)
          unzip - q "$WORKER_ZIP" - d "$TEMP_DIR"
          echo "已解压到临时目录: $TEMP_DIR"
          echo "TEMP_DIR=$TEMP_DIR" >> "$GITHUB_OUTPUT"

      - name: 混淆 JS 文件
        run: |
          set - euo pipefail
          OBFUSCATED_DIR="obfuscated"
          mkdir - p $OBFUSCATED_DIR
          TEMP_DIR=${{ steps.extract - worker.outputs.TEMP_DIR }}
          find "$TEMP_DIR" - type f - name "*.js" | while read - r js_file; do
            FILENAME=$(basename "$js_file")
            # 判断文件名是否为 _worker_obfuscated.js，若是则重命名为 worker.js，否则保持原名
            if [[ $FILENAME == "_worker_obfuscated.js" ]]; then
              OUTPUT_FILENAME="worker.js"
            else
              OUTPUT_FILENAME=$FILENAME
            fi
            OUTPUT_FILE="$OBFUSCATED_DIR/$OUTPUT_FILENAME"
            javascript - obfuscator "$js_file" "$OUTPUT_FILE" --compact --variable - name - changer hexadecimal 
          done

      - name: 提交混淆结果到仓库
        if: always()
        uses: stefanzweifel/git - auto - commit - action@v5
        with:
          commit_message: "🔄 混淆 worker.zip 中的 JS 文件 (版本: ${{ steps.download - latest.outputs.TAG_NAME }})"
          files: |
            unobfuscated/worker.zip
            obfuscated/
          commit_author: github - actions[bot] <github - actions[bot]@users.noreply.github.com>
          args: --allow - empty - directory
