name: 工作流自带混淆（确保混淆文件入指定目录）
on:
  push:
    branches: [main] 
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 

      - name: 安装混淆工具
        run: |
          npm install -g javascript-obfuscator@latest

      - name: 下载并解压 worker.zip
        run: |
          REPO_OWNER="bia-pain-bache" 
          REPO_NAME="BPB-Worker-Panel" 
          response=$(curl -s https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest)
          DOWNLOAD_URL=$(echo "$response" | jq -r '.assets[] | select(.name == "worker.zip") | .browser_download_url')
          mkdir -p unobfuscated
          curl -sL "$DOWNLOAD_URL" -o unobfuscated/worker.zip
          unzip -q unobfuscated/worker.zip -d unobfuscated/
          echo "✅ 下载并解压完成，文件在 unobfuscated 目录"

      - name: 混淆 JS 文件到根目录“混淆”文件夹（强化路径检查）
        run: |
          # 检查并创建混淆目录
          OBFUSCATED_DIR="混淆"
          if [! -d "$OBFUSCATED_DIR" ]; then
            mkdir -p "$OBFUSCATED_DIR"
            echo "✅ 创建根目录下的 $OBFUSCATED_DIR 文件夹"
          else
            echo "✅ $OBFUSCATED_DIR 文件夹已存在"
          fi
          
          find unobfuscated -type f -name "*.js" | while read -r js_file; do
            FILENAME=$(basename "$js_file")
            OUTPUT_FILE="$OBFUSCATED_DIR/${FILENAME%.*}_obfuscated.js"
            
            # 执行混淆并检查文件是否生成
            javascript-obfuscator "$js_file" "$OUTPUT_FILE" --compact --variable-name-changer hexadecimal
            if [! -f "$OUTPUT_FILE" ]; then
              echo "❌ 混淆文件 $OUTPUT_FILE 未生成，检查混淆工具输出"
              exit 1
            else
              echo "✅ 成功混淆: $FILENAME -> $OUTPUT_FILE"
            fi
          done

      - name: 提交结果
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 工作流混淆 JS 文件"
          files: |
            unobfuscated/
            混淆/
          args: --allow-empty-directory
